name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支新推送时自动取消仍在跑的旧运行，避免排队浪费时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 编译检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      # --all-targets 同时类型检查测试代码，但不做链接，速度远快于 cargo test
      - name: cargo check（全目标，含测试代码）
        run: cargo check --all-targets --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
        continue-on-error: true

  build:
    name: 构建 NSIS 安装包
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release
          cache-on-failure: true

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Relic（NSIS）
        run: npm run tauri:build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Relic-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
